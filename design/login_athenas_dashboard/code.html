<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Athenas Dashboard</title>
<!-- Fonts: Geist & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config from Style Guidance -->
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#f8f9ff",
                      "error": "#ba1a1a",
                      "secondary": "#4648d4",
                      "surface-container": "#e5eeff",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "on-error": "#ffffff",
                      "outline": "#76777d",
                      "surface-bright": "#f8f9ff",
                      "outline-variant": "#c6c6cd",
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#213145",
                      "primary": "#000000",
                      "on-surface-variant": "#45464d",
                      "on-primary-container": "#7c839b",
                      "surface-dim": "#cbdbf5",
                      "inverse-on-surface": "#eaf1ff",
                      "error-container": "#ffdad6",
                      "on-secondary": "#ffffff",
                      "tertiary-container": "#271901",
                      "on-background": "#0b1c30",
                      "secondary-container": "#6063ee",
                      "tertiary-fixed-dim": "#dec29a",
                      "on-secondary-fixed": "#07006c",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed-variant": "#574425",
                      "primary-container": "#131b2e",
                      "on-tertiary-container": "#98805d",
                      "primary-fixed": "#dae2fd",
                      "secondary-fixed-dim": "#c0c1ff",
                      "surface-container-low": "#eff4ff",
                      "inverse-primary": "#bec6e0",
                      "surface-container-high": "#dce9ff",
                      "surface-variant": "#d3e4fe",
                      "on-primary-fixed-variant": "#3f465c",
                      "surface": "#f8f9ff",
                      "secondary-fixed": "#e1e0ff",
                      "on-primary-fixed": "#131b2e",
                      "primary-fixed-dim": "#bec6e0",
                      "tertiary-fixed": "#fcdeb5",
                      "on-tertiary-fixed": "#271901",
                      "on-secondary-container": "#fffbff",
                      "surface-container-highest": "#d3e4fe",
                      "surface-tint": "#565e74",
                      "tertiary": "#000000",
                      "on-surface": "#0b1c30",
                      "on-error-container": "#93000a",
                      "on-primary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-max": "1440px",
                      "row-padding": "12px",
                      "gutter": "24px",
                      "sidebar-width": "240px",
                      "stack-gap": "16px",
                      "topbar-height": "56px"
              },
              "fontFamily": {
                      "headline-lg": ["Geist"],
                      "label-md": ["Geist"],
                      "headline-sm": ["Geist"],
                      "body-md": ["Geist"],
                      "headline-md": ["Geist"],
                      "code": ["jetbrainsMono"],
                      "body-sm": ["Geist"],
                      "body-lg": ["Geist"],
                      "label-sm": ["Geist"]
              },
              "fontSize": {
                      "headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                      "headline-sm": ["18px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "code": ["13px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Login Card Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-8 flex flex-col gap-6">
<!-- Header -->
<header class="text-center flex flex-col gap-2">
<!-- Brand Icon (Optional but nice for ERP login) -->
<div class="mx-auto flex h-12 w-12 items-center justify-center rounded-lg bg-surface-container-low text-primary mb-2">
<span class="material-symbols-outlined" style="font-size: 28px; font-variation-settings: 'FILL' 1;">dashboard</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Athenas Dashboard</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Painel administrativo ERP. Escolha entre o modo real para produção ou protótipo para testes.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-4">
<!-- Username Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="username">Usuário</label>
<div class="relative">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-outline text-[18px]">person</span>
</div>
<input class="block w-full rounded-md border border-outline-variant bg-surface-container-lowest py-2 pl-10 pr-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" id="username" name="username" placeholder="Digite seu usuário" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex justify-between" for="password">
                    Senha
                    <a class="text-secondary hover:underline" href="#">Esqueceu?</a>
</label>
<div class="relative">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-outline text-[18px]">lock</span>
</div>
<input class="block w-full rounded-md border border-outline-variant bg-surface-container-lowest py-2 pl-10 pr-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="mt-2 flex w-full items-center justify-center gap-2 rounded-md bg-primary px-4 py-2.5 font-label-md text-label-md text-on-primary transition-opacity hover:opacity-90 active:opacity-100" type="button">
                Entrar (modo Real)
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Separator -->
<div class="relative flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-4 flex-shrink-0 font-body-sm text-body-sm text-on-surface-variant">ou</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Action -->
<div class="flex flex-col gap-4 text-center">
<button class="flex w-full items-center justify-center gap-2 rounded-md border border-outline-variant bg-transparent px-4 py-2.5 font-label-md text-label-md text-primary transition-colors hover:bg-surface-container-low" type="button">
<span class="material-symbols-outlined text-[18px]">experiment</span>
                Continuar em modo Protótipo
            </button>
<!-- Footer Info -->
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[90%] mx-auto">
<span class="material-symbols-outlined inline-block align-text-bottom text-[16px] mr-1">info</span>
                O modo protótipo utiliza dados simulados para demonstração de funcionalidades.
            </p>
</div>
</main>
</body></html>
